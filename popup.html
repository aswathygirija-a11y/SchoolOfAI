<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Recorder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Session Recorder</h1>
      <p class="hint">Records the tab that was active when you opened this popup.</p>
      <button type="button" id="openRecorder" class="btn primary">
        Open recorder
      </button>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
